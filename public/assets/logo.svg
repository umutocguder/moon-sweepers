<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0B1226"/>
      <stop offset="100%" stop-color="#03050B"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#CC6600"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="108" fill="url(#spaceGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Moon Crescent Background -->
  <path d="M 360 100 C 420 180 420 320 340 400 C 260 480 140 460 100 420 C 180 460 320 440 370 340 C 420 240 380 140 360 100 Z" 
        fill="url(#moonGrad)" opacity="0.3"/>
  
  <!-- Lunar Dust Particles in Orbit -->
  <circle cx="160" cy="110" r="4" fill="#00F0FF" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="390" cy="190" r="5" fill="#FFD700" opacity="0.9" filter="url(#neonGlow)"/>
  <circle cx="110" cy="310" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="410" cy="340" r="4" fill="#00F0FF" opacity="0.8"/>

  <!-- Astronaut Helmet Outer Frame -->
  <circle cx="256" cy="240" r="140" fill="#1E293B" stroke="#475569" stroke-width="8"/>
  <rect x="236" y="360" width="40" height="40" rx="8" fill="#334155"/>

  <!-- Helmet Visor (Golden Curved Mirror) -->
  <path d="M 160 230 C 160 170 200 140 256 140 C 312 140 352 170 352 230 C 352 290 300 310 256 310 C 212 310 160 290 160 230 Z" 
        fill="url(#visorGrad)" stroke="#FFD700" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Visor Reflection Highlight -->
  <path d="M 185 180 C 205 160 240 155 270 155 C 250 170 215 185 185 180 Z" fill="#FFFFFF" opacity="0.75"/>

  <!-- The Iconic Toothbrush / Vacuum Cleaner Crossed -->
  <!-- Toothbrush Handle -->
  <path d="M 170 380 L 350 200" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Bristles -->
  <rect x="340" y="175" width="30" height="18" rx="4" fill="#FFFFFF" transform="rotate(-45 340 175)"/>
  <line x1="335" y1="180" x2="355" y2="160" stroke="#00F0FF" stroke-width="3"/>
  <line x1="345" y1="190" x2="365" y2="170" stroke="#00F0FF" stroke-width="3"/>

  <!-- Subtitle Text -->
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="4">MOON SWEEPERS</text>
  <text x="256" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#00F0FF" letter-spacing="2">LUNAR SURFACE DEPT.</text>
</svg>
